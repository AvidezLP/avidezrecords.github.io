<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Avidez Records</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:
linear-gradient(
135deg,
#020617,
#071b3b,
#020617
);

min-height:100vh;

display:flex;
justify-content:center;
align-items:center;

padding:40px 20px;

overflow-x:hidden;

}

.container-form{

width:100%;
max-width:900px;

background:
rgba(255,255,255,.05);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.08);

border-radius:35px;

padding:45px;

box-shadow:
0 25px 60px rgba(0,0,0,.45);

position:relative;

overflow:hidden;

}

.container-form::before{

content:"";

position:absolute;

top:0;
left:0;

width:100%;
height:5px;

background:
linear-gradient(
90deg,
#00bfff,
#ffd369
);

}

.logo{

width:90px;
height:90px;

margin:auto;
margin-bottom:25px;

border-radius:25px;

background:
linear-gradient(
135deg,
#00bfff,
#005eff
);

display:flex;
justify-content:center;
align-items:center;

font-size:35px;
font-weight:900;

color:white;

box-shadow:
0 15px 35px rgba(0,191,255,.35);

}

h1{

text-align:center;

font-size:3rem;
font-weight:800;

margin-bottom:10px;

background:
linear-gradient(
135deg,
#ffffff,
#ffd369
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

.subtitulo{

text-align:center;

color:#cbd5e1;

margin-bottom:40px;

font-size:1.05rem;

}

.form-label{

color:#ffd369;

font-weight:700;

margin-bottom:10px;

}

.form-control{

background:
rgba(2,12,30,.9);

border:1px solid rgba(255,255,255,.08);

border-radius:18px;

padding:18px;

color:white;

}

.form-control:focus{

background:
rgba(2,12,30,1);

border-color:#00bfff;

color:white;

box-shadow:
0 0 0 .2rem rgba(0,191,255,.15);

}

::placeholder{

color:#8ba3c7 !important;

}

textarea{

resize:none;

}

.file-box{

background:
rgba(2,12,30,.9);

padding:10px;

border-radius:18px;

border:2px dashed rgba(255,211,105,.35);

}

.btn-enviar{

width:100%;

border:none;

padding:18px;

border-radius:18px;

font-size:1rem;
font-weight:800;

background:
linear-gradient(
135deg,
#00bfff,
#005eff
);

color:white;

margin-top:20px;

transition:.3s;

}

.btn-enviar:hover{

transform:translateY(-3px);

box-shadow:
0 18px 40px rgba(0,191,255,.3);

}

.modal-ok{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.7);

display:none;

justify-content:center;
align-items:center;

padding:20px;

z-index:9999;

}

.modal-box{

width:100%;
max-width:500px;

background:
linear-gradient(
135deg,
#08182f,
#0d2855
);

padding:40px;

border-radius:30px;

text-align:center;

box-shadow:
0 25px 60px rgba(0,0,0,.45);

}

.check{

width:85px;
height:85px;

margin:auto;
margin-bottom:25px;

border-radius:25px;

background:
linear-gradient(
135deg,
#00bfff,
#005eff
);

display:flex;
justify-content:center;
align-items:center;

font-size:40px;
font-weight:900;

color:white;

}

.modal-box h2{

font-size:2rem;
font-weight:800;

margin-bottom:15px;

color:white;

}

.modal-box p{

color:#d4dce8;

}

.codigo{

margin:25px 0;

padding:20px;

border-radius:22px;

background:
rgba(255,255,255,.04);

border:2px solid rgba(255,211,105,.3);

}

.codigo span{

display:block;

margin-bottom:10px;

color:#d4dce8;

}

.codigo h3{

font-size:1.5rem;
font-weight:900;

color:#ffd369;

}

.btn-cerrar{

border:none;

padding:15px 35px;

border-radius:50px;

background:
linear-gradient(
135deg,
#00bfff,
#005eff
);

color:white;

font-weight:800;

margin-top:15px;

}

</style>

</head>

<body>

<div class="container-form">

<div class="logo">
AR
</div>

<h1>
Avidez Records
</h1>

<p class="subtitulo">
Completa los datos de tu proyecto y adjunta el archivo
</p>

<form id="formularioPedidos">

<div class="mb-4">

<label class="form-label">
Nombre Completo
</label>

<input
type="text"
name="nombre"
class="form-control"
placeholder="Ej: Juan Pérez"
required
>

</div>

<div class="mb-4">

<label class="form-label">
Correo Electrónico
</label>

<input
type="email"
name="correo"
class="form-control"
placeholder="Ej: correo@gmail.com"
required
>

</div>

<div class="mb-4">

<label class="form-label">
Número de Teléfono
</label>

<input
type="text"
name="telefono"
class="form-control"
placeholder="Ej: 59171234567"
required
>

</div>

<div class="mb-4">

<label class="form-label">
Título del Proyecto
</label>

<input
type="text"
name="titulo"
class="form-control"
placeholder="Ej: Página web premium"
required
>

</div>

<div class="mb-4">

<label class="form-label">
Descripción del Proyecto
</label>

<textarea
name="descripcion"
rows="5"
class="form-control"
placeholder="Describe tu proyecto..."
required
></textarea>

</div>

<div class="mb-4">

<label class="form-label">
Observaciones
</label>

<textarea
name="obsCliente"
rows="4"
class="form-control"
placeholder="Comentarios adicionales..."
></textarea>

</div>

<div class="mb-4">

<label class="form-label">
Monto
</label>

<input
type="number"
name="monto"
class="form-control"
placeholder="Ej: 500"
required
>

</div>

<div class="mb-4">

<label class="form-label">
Subir Archivo
</label>

<div class="file-box">

<input
id="archivoQR"
type="file"
class="form-control"
required
>

</div>

</div>

<button
type="submit"
id="botonEnviar"
class="btn-enviar"
>
ENVIAR SOLICITUD
</button>

</form>

</div>


<div id="modalOk" class="modal-ok">

<div class="modal-box">

<div class="check">
✓
</div>

<h2>
¡Solicitud enviada!
</h2>

<p>
Tu solicitud fue registrada correctamente.
</p>

<div class="codigo">

<span>
Código de seguimiento
</span>

<h3 id="codigo">
SOLC-0000
</h3>

</div>

<button
onclick="cerrarModal()"
class="btn-cerrar"
>
ENTENDIDO
</button>

</div>

</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbw2FEhLrK2mogHV2TuR_XQtPVx6pic8zDBYmi9izYEvuAq7a9mkekqFvLFkmzXVy_GN/exec";

const formulario =
document.getElementById("formularioPedidos");

const archivoQR =
document.getElementById("archivoQR");

const botonEnviar =
document.getElementById("botonEnviar");

const modal =
document.getElementById("modalOk");

const codigo =
document.getElementById("codigo");

function cerrarModal(){

modal.style.display =
"none";

}

function generarCodigo(){

const fecha =
new Date();

return "SOLC-" +

fecha.getFullYear() +

(fecha.getMonth()+1) +

fecha.getDate() +

fecha.getHours() +

fecha.getMinutes() +

fecha.getSeconds();

}

formulario.addEventListener(

"submit",

function(e){

e.preventDefault();

const archivo =
archivoQR.files[0];

if(!archivo){

alert("Seleccione un archivo");

return;

}

botonEnviar.disabled =
true;

botonEnviar.innerHTML =
"ENVIANDO...";

const lector =
new FileReader();

lector.onload =
function(){

const base64 =
lector.result.split(",")[1];

const formData =
new FormData();

formData.append(
"nombre",
formulario.nombre.value
);

formData.append(
"correo",
formulario.correo.value
);

formData.append(
"telefono",
formulario.telefono.value
);

formData.append(
"titulo",
formulario.titulo.value
);

formData.append(
"descripcion",
formulario.descripcion.value
);

formData.append(
"obsCliente",
formulario.obsCliente.value
);

formData.append(
"monto",
formulario.monto.value
);

formData.append(
"qrNombre",
archivo.name
);

formData.append(
"qrMime",
archivo.type
);

formData.append(
"qrBase64",
base64
);

fetch(

SCRIPT_URL,

{
method:"POST",
body:formData,
mode:"no-cors"
}

)

.then(() => {

const codigoGenerado =
generarCodigo();

codigo.innerHTML =
codigoGenerado;

modal.style.display =
"flex";

const telefono =
formulario.telefono.value;

const mensaje =

`Hola ${formulario.nombre.value}, tu solicitud fue registrada correctamente ✅

📌 Proyecto:
${formulario.titulo.value}

💰 Monto:
${formulario.monto.value} Bs.

📌 Código:
${codigoGenerado}`;

window.open(

`https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`,

"_blank"

);

formulario.reset();

botonEnviar.disabled =
false;

botonEnviar.innerHTML =
"ENVIAR SOLICITUD";

})

.catch(error => {

console.log(error);

alert("Error al enviar");

botonEnviar.disabled =
false;

botonEnviar.innerHTML =
"ENVIAR SOLICITUD";

});

};

lector.readAsDataURL(archivo);

}

);

</script>

</body>
</html>
