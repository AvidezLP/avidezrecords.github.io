<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Avidez Records</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:
linear-gradient(
135deg,
#070b1a,
#0a1f44,
#07101f
);

min-height:100vh;
overflow-x:hidden;
padding:50px 20px;
position:relative;
display:flex;
justify-content:center;
align-items:center;

}

/* EFECTOS */

.glow1{

position:absolute;
width:500px;
height:500px;
border-radius:50%;

background:
radial-gradient(circle,#00a2ff55,transparent);

top:-250px;
left:-180px;

filter:blur(30px);

}

.glow2{

position:absolute;
width:450px;
height:450px;
border-radius:50%;

background:
radial-gradient(circle,#ffd36944,transparent);

bottom:-200px;
right:-160px;

filter:blur(30px);

}

.container-form{

width:100%;
max-width:950px;

background:
rgba(255,255,255,.05);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.08);

border-radius:35px;

padding:50px;

position:relative;
z-index:2;

box-shadow:
0 25px 70px rgba(0,0,0,.45);

overflow:hidden;

}

/* LINEA DECORATIVA */

.container-form::before{

content:"";

position:absolute;

top:0;
left:0;

width:100%;
height:6px;

background:
linear-gradient(
90deg,
#00bfff,
#ffd369,
#00bfff
);

}

/* LOGO */

.logo{

width:100px;
height:100px;

margin:auto;
margin-bottom:25px;

border-radius:30px;

background:
linear-gradient(
135deg,
#00bfff,
#0066ff
);

display:flex;
justify-content:center;
align-items:center;

font-size:42px;
font-weight:900;

color:white;

box-shadow:
0 15px 40px rgba(0,191,255,.35);

transform:rotate(-8deg);

}

/* TITULOS */

h1{

text-align:center;

font-size:3.2rem;
font-weight:800;

margin-bottom:12px;

background:
linear-gradient(
135deg,
#ffffff,
#ffd369
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

.subtitulo{

text-align:center;

color:#c9d9f2;

font-size:1.08rem;

margin-bottom:45px;

}

/* LABELS */

.form-label{

font-weight:700;

margin-bottom:12px;

color:#ffd369;

font-size:.95rem;

letter-spacing:.5px;

}

/* INPUTS */

.form-control{

background:
rgba(10,22,50,.95);

border:1px solid rgba(255,255,255,.08);

border-radius:20px;

padding:18px;

color:white;

font-size:1rem;

transition:.3s;

}

.form-control:focus{

background:
rgba(10,22,50,1);

border-color:#00bfff;

color:white;

box-shadow:
0 0 0 .25rem rgba(0,191,255,.18);

transform:translateY(-2px);

}

/* PLACEHOLDER */

::placeholder{

color:#88a6d9;
opacity:1;

}

/* TEXTAREA */

textarea{

resize:none;

}

/* FILE */

.file-box{

background:
rgba(10,22,50,.95);

padding:12px;

border-radius:20px;

border:2px dashed rgba(255,211,105,.45);

}

input[type="file"]{

color:white;

}

/* BOTON */

.btn-enviar{

width:100%;

border:none;

padding:18px;

border-radius:20px;

font-size:1rem;
font-weight:800;

background:
linear-gradient(
135deg,
#00bfff,
#0066ff
);

color:white;

margin-top:25px;

transition:.35s;

box-shadow:
0 15px 35px rgba(0,191,255,.22);

}

.btn-enviar:hover{

transform:translateY(-3px);

box-shadow:
0 18px 40px rgba(0,191,255,.35);

}

/* MODAL */

.modal-ok{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.65);

backdrop-filter:blur(7px);

display:none;

justify-content:center;
align-items:center;

z-index:9999;

padding:20px;

}

.modal-box{

width:100%;
max-width:540px;

background:
linear-gradient(
135deg,
#08182f,
#0d2855
);

padding:45px;

border-radius:35px;

text-align:center;

border:1px solid rgba(255,255,255,.08);

box-shadow:
0 25px 70px rgba(0,0,0,.45);

animation:modal .35s ease;

}

.check{

width:95px;
height:95px;

margin:auto;
margin-bottom:25px;

border-radius:30px;

background:
linear-gradient(
135deg,
#00bfff,
#0066ff
);

display:flex;
justify-content:center;
align-items:center;

font-size:45px;
font-weight:900;

color:white;

box-shadow:
0 15px 35px rgba(0,191,255,.35);

}

.modal-box h2{

font-size:2.2rem;
font-weight:800;

margin-bottom:15px;

color:white;

}

.modal-box p{

color:#c7d8ef;

line-height:1.7;

}

.codigo{

margin:28px 0;

padding:24px;

border-radius:24px;

background:
rgba(255,255,255,.04);

border:2px solid rgba(255,211,105,.35);

}

.codigo span{

display:block;

margin-bottom:12px;

color:#c7d8ef;

}

.codigo h3{

font-size:1.5rem;
font-weight:900;

color:#ffd369;

margin:0;

word-break:break-word;

}

.btn-cerrar{

border:none;

padding:16px 35px;

border-radius:50px;

background:
linear-gradient(
135deg,
#00bfff,
#0066ff
);

color:white;

font-weight:800;

margin-top:15px;

}

/* ANIMACION */

@keyframes modal{

from{
opacity:0;
transform:translateY(30px) scale(.9);
}

to{
opacity:1;
transform:translateY(0) scale(1);
}

}

@media(max-width:768px){

.container-form{

padding:30px 22px;

}

h1{

font-size:2.4rem;

}

.logo{

width:80px;
height:80px;
font-size:34px;

}

.modal-box{

padding:35px 22px;

}

}

</style>

</head>

<body>

<div class="glow1"></div>
<div class="glow2"></div>

<div class="container-form">

<div class="logo">
AR
</div>

<h1>
Avidez Records
</h1>

<p class="subtitulo">
Completa los datos de tu proyecto y adjunta el archivo
</p>

<form id="formularioPedidos">

<div class="mb-4">

<label class="form-label">
Nombre Completo
</label>

<input
type="text"
name="nombre"
class="form-control"
placeholder="Ej: Juan Pérez"
required
>

</div>

<div class="mb-4">

<label class="form-label">
Correo Electrónico
</label>

<input
type="email"
name="correo"
class="form-control"
placeholder="Ej: juan@gmail.com"
required
>

</div>

<div class="mb-4">

<label class="form-label">
Número de Teléfono
</label>

<input
type="text"
name="telefono"
class="form-control"
placeholder="Ej: 59171234567"
required
>

</div>

<div class="mb-4">

<label class="form-label">
Título del Proyecto
</label>

<input
type="text"
name="titulo"
class="form-control"
placeholder="Ej: Página web para restaurante"
required
>

</div>

<div class="mb-4">

<label class="form-label">
Descripción del Proyecto
</label>

<textarea
name="descripcion"
rows="5"
class="form-control"
placeholder="Explique detalladamente el proyecto..."
required
></textarea>

</div>

<div class="mb-4">

<label class="form-label">
Observaciones del Proyecto
</label>

<textarea
name="obsCliente"
rows="4"
class="form-control"
placeholder="Comentarios adicionales..."
></textarea>

</div>

<div class="mb-4">

<label class="form-label">
Monto
</label>

<input
type="number"
name="monto"
class="form-control"
placeholder="Ej: 500"
required
>

</div>

<div class="mb-4">

<label class="form-label">
Subir Archivo de Referencia
</label>

<div class="file-box">

<input
id="archivoQR"
type="file"
class="form-control"
required
>

</div>

</div>

<button
type="submit"
id="botonEnviar"
class="btn-enviar"
>
ENVIAR SOLICITUD
</button>

</form>

</div>


<!-- MODAL -->

<div id="modalOk" class="modal-ok">

<div class="modal-box">

<div class="check">
✓
</div>

<h2>
¡Solicitud registrada!
</h2>

<p>
Tu solicitud fue enviada correctamente al sistema.
</p>

<div class="codigo">

<span>
Código de seguimiento
</span>

<h3 id="codigo">
SOLC-0000
</h3>

</div>

<button
onclick="cerrarModal()"
class="btn-cerrar"
>
ENTENDIDO
</button>

</div>

</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzkNhaJ9yzyl_PHW7r4-rRjoV2RNNHa-G70NtS3NRMHpr7o-GIFHPZCr5ITz7mcA9ox/exec";

const formulario =
document.getElementById("formularioPedidos");

const archivoQR =
document.getElementById("archivoQR");

const botonEnviar =
document.getElementById("botonEnviar");

const modal =
document.getElementById("modalOk");

const codigo =
document.getElementById("codigo");

function cerrarModal(){

modal.style.display =
"none";

}

function generarCodigo(){

const fecha =
new Date();

return "SOLC-" +
fecha.getFullYear() +
(fecha.getMonth()+1) +
fecha.getDate() +
fecha.getHours() +
fecha.getMinutes() +
fecha.getSeconds();

}

formulario.addEventListener(
"submit",

function(e){

e.preventDefault();

const archivo =
archivoQR.files[0];

if(!archivo){

alert("Seleccione un archivo");

return;

}

botonEnviar.disabled = true;

botonEnviar.innerHTML =
"ENVIANDO...";

const lector =
new FileReader();

lector.onload =
function(){

const base64 =
lector.result.split(",")[1];

const datos = {

nombre:
formulario.nombre.value,

correo:
formulario.correo.value,

telefono:
formulario.telefono.value,

titulo:
formulario.titulo.value,

descripcion:
formulario.descripcion.value,

obsCliente:
formulario.obsCliente.value,

monto:
formulario.monto.value,

qrNombre:
archivo.name,

qrMime:
archivo.type,

qrBase64:
base64

};

fetch(

SCRIPT_URL,

{
method:"POST",

body:new URLSearchParams(
datos
)

}

)

.then(response => {

const codigoGenerado =
generarCodigo();

codigo.innerHTML =
codigoGenerado;

modal.style.display =
"flex";

const telefono =
formulario.telefono.value;

const mensaje =

`Hola ${formulario.nombre.value}, tu solicitud fue registrada correctamente ✅

📌 Proyecto:
${formulario.titulo.value}

💰 Monto:
${formulario.monto.value} Bs.

📌 Código:
${codigoGenerado}`;

window.open(

`https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`,

"_blank"

);

formulario.reset();

botonEnviar.disabled =
false;

botonEnviar.innerHTML =
"ENVIAR SOLICITUD";

})

.catch(error => {

console.log(error);

alert("Error al enviar");

botonEnviar.disabled =
false;

botonEnviar.innerHTML =
"ENVIAR SOLICITUD";

});

};

lector.readAsDataURL(archivo);

}

);

</script>

</body>
</html>
